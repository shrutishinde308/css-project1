<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>
<body>

    <nav class="navbar">
        <div class="container d-flex justify-between align-center">
            <div class="logo"><a href="../index.html">MyStore</a></div>
            <ul class="nav-links">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>


    <section class="container my-2 text-center">
        <div class="contact-box">
            <h2>Contact Us</h2>
            <p class="my-2">Have questions? Send us a message!</p>
            
            <form>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" class="form-control" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea class="form-control" rows="4" placeholder="Your Message" required></textarea>
                </div>
                <button type="button" class="btn" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </section>


    <footer>
        <div class="container footer-content">
            <div class="footer-section">
                <h3>About Us</h3>
                <p>We provide the best shopping experience with premium quality products.</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Contact Info</h3>
                <p>Email: support@mystore.com</p>
                <p>Phone: +123 456 7890</p>
            </div>
        </div>
    </footer>

</body>
</html>
